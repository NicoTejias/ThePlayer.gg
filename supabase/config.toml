# Supabase Edge Functions Configuration
# This file is used by Supabase CLI to deploy functions

[functions.create-subscription]
# La función verifica el JWT manualmente (getUser) y necesita leer el header
# Authorization, por eso verify_jwt se queda en false.
verify_jwt = false

[functions.webhook-handler]
# MercadoPago no envía un JWT de Supabase; se valida con firma HMAC. Debe ser false.
verify_jwt = false

[functions.gemini-chat]
# El chat asistente es público (visitantes sin login), no requiere JWT.
verify_jwt = false

[functions.gemini-flyer]
# El flyer se genera al crear/editar un torneo. La tienda ya está logueada,
# pero la función usa service role internamente; no exigimos JWT para simplificar.
verify_jwt = false
