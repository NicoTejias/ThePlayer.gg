<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - theplayer.gg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F141E; color: #E5E7EB; }
        .card { background-color: #1F2937; border: 1px solid #374151; }
        .card-hover:hover { transform: translateY(-4px); border-color: #3B82F6; }
        .nav-link { @apply px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white; }
    </style>
</head>
<body class="antialiased">

    <header class="bg-gray-900/50 backdrop-blur-md shadow-md sticky top-0 z-50 border-b border-gray-700/50">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="/" class="text-2xl font-bold text-white"><span class="text-blue-500">the</span>player</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/" class="nav-link">Inicio</a>
                        <div class="relative group">
                            <button class="nav-link inline-flex items-center">
                                <span>Ranking</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 ml-1"></i>
                            </button>
                            <div class="hidden group-hover:block absolute z-10 mt-2 w-48 rounded-md shadow-lg py-1 bg-gray-800 ring-1 ring-black ring-opacity-5">
                                <a href="ranking-the-player.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Ranking The Player</a>
                                <a href="ranking-maestros.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Ranking Maestros</a>
                            </div>
                        </div>
                        <a href="eventos.html" class="nav-link bg-gray-700 text-white">Eventos</a>
                        <a href="#torneos" class="nav-link">Torneos</a>
                        <div class="relative group">
                            <button class="nav-link inline-flex items-center">
                                <span>Mercado</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 ml-1"></i>
                            </button>
                            <div class="hidden group-hover:block absolute z-10 mt-2 w-48 rounded-md shadow-lg py-1 bg-gray-800 ring-1 ring-black ring-opacity-5">
                                <a href="#marketplace-venta" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Compra/Venta</a>
                                <a href="#marketplace-cambio" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">Cambios</a>
                            </div>
                        </div>
                        <a href="#jueces" class="nav-link">Jueces</a>
                        <a href="#tiendas" class="nav-link">Tiendas</a>
                    </div>
                </div>
                <div class="hidden md:block">
                    <div class="ml-4 flex items-center md:ml-6 space-x-2">
                        <div id="user-menu-logged-out"><a href="/autenticacion.html" class="px-3 py-2 rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">Login</a></div>
                        <div id="user-menu-logged-in" class="hidden items-center space-x-2">
                            <span class="text-sm font-medium text-gray-300">Hola, <span id="user-name" class="font-bold text-white">...</span></span>
                            <a href="#" class="nav-link bg-gray-700">Mi Panel</a>
                            <button id="logout-button" class="nav-link !text-red-400 hover:!bg-red-700 hover:!text-white"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button id="mobile-menu-button" type="button" class="bg-gray-800 inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none" aria-controls="mobile-menu" aria-expanded="false">
                        <i data-lucide="menu" class="block h-6 w-6"></i><i data-lucide="x" class="hidden h-6 w-6"></i>
                    </button>
                </div>
            </div>
        </nav>
        <div class="md:hidden hidden" id="mobile-menu">
            </div>
    </header>

    <main class="container mx-auto px-4 py-16">
        
        <h1 class="text-4xl font-black text-white mb-4">Próximos Eventos</h1>
        <p class="text-lg text-gray-400 mb-8">Encuentra todos los torneos y eventos de la comunidad en un solo lugar.</p>

        <div id="full-eventos-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
            
            <p id="loading-message" class="text-gray-400 md:col-span-2 lg:col-span-3">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin inline-block mr-2"></i>
                Cargando eventos...
            </p>
            
            </div>
        
    </main>
    
    <footer class="bg-gray-900/50 pt-16 pb-8 mt-16 border-t border-gray-700/50">
      <div class="text-center text-gray-500 text-sm">
          © 2025 theplayer.gg - Todos los derechos reservados.
      </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jaqrddkrtcvwbfrjukvj.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphcXJkZGtydGN2d2Jmcmp1a3ZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3ODkyNTgsImV4cCI6MjA3ODM2NTI1OH0.voPWXtJo2fTqWKCqfzFTvi4JXcwesT3q9iWkGeM2NBI';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM Elements (Autenticación) ---
        let userMenuLoggedIn, userMenuLoggedOut, userNameEl, logoutButton, mobileMenuButton, mobileMenu;

        // --- DOM Element (Eventos) ---
        let fullEventosList;
        let loadingMessage;

        /**
         * ======================================
         * FUNCIÓN DE AUTENTICACIÓN (La misma del index)
         * ======================================
         */
        async function updateUserUI(session) {
            if (session) {
                userMenuLoggedOut.classList.add('hidden');
                userMenuLoggedIn.classList.remove('hidden');
                // Ignoramos el error 406 por ahora, tal como acordamos
                const { data: perfil } = await _supabase.from('perfiles').select('nombre_usuario').eq('auth_id', session.user.id).single();
                if (perfil) {
                    userNameEl.textContent = perfil.nombre_usuario;
                } else {
                    userNameEl.textContent = session.user.email.split('@')[0];
                }
            } else {
                userMenuLoggedOut.classList.remove('hidden');
                userMenuLoggedIn.classList.add('hidden');
                userNameEl.textContent = '...';
            }
        }

        /**
         * ======================================
         * FUNCIÓN PARA LA PÁGINA DE EVENTOS
         * ======================================
         */
        
        function formatEventDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-CL', options);
        }

        function createEventoHtml(evento) {
            const region = evento.region || '---';
            const formato = evento.formato || '---';
            const fecha = formatEventDate(evento.fecha);
            const imagen = evento.imagen_url || 'https://images.unsplash.com/photo-1511884642898-4c92249e20b6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=800';

            return `
                <div class="card rounded-lg shadow-xl overflow-hidden transition duration-300 card-hover">
                    <a href="evento-detalle.html?id=${evento.id}">
                        <img src="${imagen}" alt="Imagen de ${evento.nombre_torneo}" class="w-full h-48 object-cover">
                    </a>
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold uppercase tracking-wider text-blue-400">
                                ${formato}
                            </span>
                            <span class="text-xs text-gray-400">
                                ${fecha}
                            </span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">
                            <a href="evento-detalle.html?id=${evento.id}">${evento.nombre_torneo}</a>
                        </h3>
                        <p class="text-sm text-gray-400 flex items-center">
                            <i data-lucide="map-pin" class="w-4 h-4 mr-2 text-gray-500"></i>
                            ${evento.nombre_tienda}, ${region}
                        </p>
                    </div>
                </div>
            `;
        }

        async function cargarEventosCompletos() {
            if (!fullEventosList) return;
            try {
                // ¡FUNCIÓN RPC ACTUALIZADA!
                const { data, error } = await _supabase.rpc('get_todos_los_eventos');

                if (error) throw error;

                // Ocultamos el mensaje de "Cargando..."
                loadingMessage.classList.add('hidden');

                if (data && data.length > 0) {
                    data.forEach((evento) => {
                        fullEventosList.innerHTML += createEventoHtml(evento);
                    });
                } else {
                    fullEventosList.innerHTML = '<p class="text-gray-400 md:col-span-2 lg:col-span-3">No hay eventos programados por ahora.</p>';
                }
            } catch (error) {
                console.error('Error cargando eventos:', error);
                loadingMessage.innerHTML = '<p class="text-red-400 md:col-span-2 lg:col-span-3">Error al cargar los eventos.</p>';
            }
        }

        /**
         * ======================================
         * INICIO DE LA PÁGINA (Event Listeners)
         * ======================================
         */
        document.addEventListener('DOMContentLoaded', async () => {
            // Asignar variables
            userMenuLoggedIn = document.getElementById('user-menu-logged-in');
            userMenuLoggedOut = document.getElementById('user-menu-logged-out');
            userNameEl = document.getElementById('user-name');
            logoutButton = document.getElementById('logout-button');
            mobileMenuButton = document.getElementById('mobile-menu-button');
            mobileMenu = document.getElementById('mobile-menu');
            fullEventosList = document.getElementById('full-eventos-list');
            loadingMessage = document.getElementById('loading-message');

            lucide.createIcons(); // Iniciar iconos
            
            // Revisar el estado de la sesión
            const { data: { session } } = await _supabase.auth.getSession();
            updateUserUI(session);

            // Cargar el listado de eventos
            await cargarEventosCompletos();
            
            // Re-crear iconos de Lucide (para los map-pin)
            lucide.createIcons();
            
            // Asignar listeners
            if (logoutButton) {
                logoutButton.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await _supabase.auth.signOut();
                    window.location.href = '/';
                });
            }
            if (mobileMenuButton) {
                mobileMenuButton.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    mobileMenuButton.querySelector('i[data-lucide="menu"]').classList.toggle('hidden');
                    mobileMenuButton.querySelector('i[data-lucide="x"]').classList.toggle('hidden');
                });
            }
        });

        _supabase.auth.onAuthStateChange((event, session) => {
            if (userMenuLoggedIn && userMenuLoggedOut) {
                updateUserUI(session);
            }
        });
    </script>
</body>
</html>
