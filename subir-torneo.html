<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Torneo - theplayer.gg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- ¡IMPORTANTE! Importamos la librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #E5E7EB; }
        .card { background-color: #1F2937; border: 1px solid #374151; }
        .nav-link { @apply px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white; }
        .nav-link-dropdown { @apply block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white; }
        .dropdown:hover .dropdown-menu { display: block; }
        .dropdown-menu { @apply hidden absolute z-10 mt-2 w-48 rounded-md shadow-lg py-1 bg-gray-800 ring-1 ring-black ring-opacity-5; }
        input[type="number"], select, input[type="file"] { @apply mt-1 block w-full bg-gray-800 border-gray-600 rounded-md shadow-sm p-2 text-white; }
        input[type="file"] { @apply file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700; }
        .message-box { @apply mt-6 p-4 rounded-md; }
        .message-error { @apply bg-red-800 text-red-200; }
        .message-success { @apply bg-green-800 text-green-200; }
        .message-loading { @apply bg-gray-700 text-gray-200; }
    </style>
</head>
<body class="antialiased">

    <!-- 
      ¡TAREA PARA TI! 
      Reemplaza este <header> y <footer> con los de tu 'index.html'
    -->
    <header class="bg-gray-900 shadow-md sticky top-0 z-50">
      <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex-shrink-0">
            <a href="/" class="text-2xl font-bold text-white">
                <span class="text-blue-500">the</span>player.gg
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container mx-auto px-4 py-16">
        <div class="card max-w-2xl mx-auto rounded-lg shadow-xl overflow-hidden">
            
            <!-- Mensaje de respuesta (Ahora está arriba) -->
            <div id="message-container" class="message-box m-4 hidden"></div>

            <!-- Formulario de Subida -->
            <div id="form-container" class="p-8">
                <h1 class="text-3xl font-bold text-white mb-6">Subir Resultados de Torneo</h1>
                <p class="text-gray-400 mb-6">Esta herramienta es solo para Tiendas Asociadas. Sube el archivo .html de Eventlink o Melee.</p>

                <form id="torneo-form" class="space-y-6">
                    <div>
                        <label for="formato" class="block text-sm font-medium text-gray-300">Formato del Torneo</label>
                        <select id="formato" name="formato" required>
                            <option value="standard">Standard</option>
                            <option value="pioneer">Pioneer</option>
                            <option value="modern">Modern</option>
                            <option value="draft">Draft</option>
                            <option value="sellado">Sellado</option>
                        </select>
                    </div>
                    <div>
                        <label for="multiplicador" class="block text-sm font-medium text-gray-300">Multiplicador PWP</label>
                        <input type="number" id="multiplicador" name="multiplicador" value="1" min="1" required>
                    </div>
                    <div>
                        <label for="nro_jugadores" class="block text-sm font-medium text-gray-300">Número de Jugadores</label>
                        <input type="number" id="nro_jugadores" name="nro_jugadores" min="4" required>
                    </div>
                    <div>
                        <label for="archivo_html" class="block text-sm font-medium text-gray-300">Archivo de Resultados (.html)</label>
                        <input type="file" id="archivo_html" name="archivo_html" accept=".html" required>
                    </div>
                    <div>
                        <button type="submit" id="submit-button" class="w-full flex justify-center py-3 px-4 rounded-md shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700">
                            Subir y Procesar Torneo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <footer class="bg-gray-900 pt-16 pb-8 mt-16">
      <div class="text-center text-gray-500 text-sm">
         © 2025 theplayer.gg - Todos los derechos reservados.
      </div>
    </footer>

    <!--
    || ==================================================================== ||
    || SCRIPT DE AUTENTICACIÓN: Esto protege la página
    || ==================================================================== ||
    -->
    <script>
        // --- ¡¡IMPORTANTE!! REEMPLAZA ESTO CON TUS LLAVES ---
        const SUPABASE_URL = 'PEGA_TU_PROJECT_URL_AQUI'; 
        const SUPABASE_ANON_KEY = 'PEGA_TU_LLAVE_ANON_PUBLIC_AQUI';
        // --------------------------------------------------

        if (SUPABASE_URL.includes('PEGA_TU')) {
            alert('ERROR: Debes editar el archivo .html y poner tus llaves de Supabase para que el login funcione.');
        }

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Elementos del DOM ---
        const formContainer = document.getElementById('form-container');
        const form = document.getElementById('torneo-form');
        const messageContainer = document.getElementById('message-container');
        const submitButton = document.getElementById('submit-button');

        // --- Función para mostrar mensajes ---
        function showMessage(type, text) {
            messageContainer.classList.remove('hidden', 'message-error', 'message-success', 'message-loading');
            if (type === 'error') {
                messageContainer.classList.add('message-error');
            } else if (type === 'success') {
                messageContainer.classList.add('message-success');
            } else {
                messageContainer.classList.add('message-loading');
            }
            messageContainer.textContent = text;
        }

        // --- 1. VERIFICAR PERMISOS AL CARGAR LA PÁGINA ---
        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons(); // Iniciar iconos
            
            showMessage('loading', 'Verificando permisos...');
            formContainer.classList.add('hidden'); // Ocultar formulario por defecto

            const { data: { session }, error: sessionError } = await _supabase.auth.getSession();

            if (!session) {
                showMessage('error', 'Acceso denegado. Debes iniciar sesión para subir un torneo.');
                return;
            }

            // Si hay sesión, buscamos el ROL en nuestra tabla 'perfiles'
            const { data: perfil, error: perfilError } = await _supabase
                .from('perfiles')
                .select('rol')
                .eq('auth_id', session.user.id)
                .single();

            if (perfilError || !perfil) {
                showMessage('error', 'No se pudo encontrar tu perfil de usuario.');
                return;
            }

            // --- ¡EL CONTROL DE SEGURIDAD! ---
            if (perfil.rol === 'admin' || perfil.rol === 'tienda') {
                // El usuario SÍ tiene permisos
                showMessage('success', 'Permiso verificado. Listo para subir torneo.');
                formContainer.classList.remove('hidden'); // Mostrar formulario
            } else {
                // El usuario es un simple "jugador"
                showMessage('error', 'Acceso denegado. No tienes permisos de "Tienda" o "Admin" para subir torneos.');
            }
        });


        // --- 2. LÓGICA DE SUBIDA (CON TOKEN DE AUTENTICACIÓN) ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitButton.disabled = true;
            submitButton.textContent = 'Procesando...';
            
            // 1. LEER EL ARCHIVO HTML
            const fileInput = document.getElementById('archivo_html');
            if (fileInput.files.length === 0) {
                showMessage('error', 'Por favor, selecciona un archivo .html');
                submitButton.disabled = false;
                submitButton.textContent = 'Subir y Procesar Torneo';
                return;
            }
            const file = fileInput.files[0];
            const archivoHTMLComoTexto = await file.text();
            
            // 2. OBTENER EL TOKEN DE SESIÓN (La "Credencial")
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                showMessage('error', 'Tu sesión expiró. Por favor, recarga la página e inicia sesión de nuevo.');
                return;
            }

            // 3. PREPARAR DATOS PARA EL "MOTOR"
            const datosParaEnviar = {
                formato: document.getElementById('formato').value,
                multiplicador_pwp: parseInt(document.getElementById('multiplicador').value),
                nro_jugadores: parseInt(document.getElementById('nro_jugadores').value),
                contenidoHTML: archivoHTMLComoTexto
            };

            try {
                // 4. LLAMAR AL "MOTOR" (¡AHORA INCLUYE EL TOKEN!)
                const response = await fetch('/api/subir-torneo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // ¡LA NUEVA LÍNEA DE SEGURIDAD!
                        'Authorization': `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify(datosParaEnviar),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('success', data.message);
                    form.reset();
                } else {
                    // Mostrar error (ej. 403 Prohibido)
                    showMessage('error', data.message || 'Error desconocido del servidor');
                }

            } catch (error) {
                console.error('Error de red:', error);
                showMessage('error', 'Error fatal de conexión. Revisa la consola.');
            }

            submitButton.disabled = false;
            submitButton.textContent = 'Subir y Procesar Torneo';
        });

    </script>
</body>
</html>
